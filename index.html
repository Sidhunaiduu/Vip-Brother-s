<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090909">

<title>VIP BROTHER'S - Private Pass</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #090909;
    font-family: 'Inter', sans-serif;
    color: white;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    padding: 20px;
}

/* BACKGROUND */

.background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
}

.star {
    position: absolute;
    background: white;
    border-radius: 50%;
    opacity: .4;
    animation: twinkle 3s infinite alternate;
}

@keyframes twinkle {
    from { opacity: .15; }
    to { opacity: .8; }
}

/* MAIN CONTAINER */

.container {
    width: 100%;
    max-width: 390px;
    position: relative;
    z-index: 2;
    text-align: center;
}

/* TOP TEXT */

.top-title {
    font-size: 10px;
    letter-spacing: 4px;
    font-weight: 600;
    color: #d6d6d6;
    margin-bottom: 25px;
}

.top-title span {
    color: #fff;
    margin: 0 8px;
}

/* TICKET */

.ticket {
    position: relative;
    width: 100%;
    padding: 23px 20px 20px;
    border-radius: 19px;
    color: #111;
    overflow: hidden;

    background:
    linear-gradient(
        120deg,
        #f5e5e9,
        #d8f4f1,
        #f8e5d9,
        #eee0f7,
        #d9f3ed,
        #f5e5e9
    );

    background-size: 400% 400%;
    animation: hologram 9s ease infinite;

    box-shadow: 0 0 35px rgba(255,255,255,.09);
}

@keyframes hologram {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* TICKET CUTS */

.ticket::before,
.ticket::after {
    content: "";
    position: absolute;
    width: 23px;
    height: 23px;
    background: #111;
    border-radius: 50%;
    top: 62%;
}

.ticket::before {
    left: -13px;
}

.ticket::after {
    right: -13px;
}

/* HEADER */

.ticket-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 8px;
    font-weight: 800;
    letter-spacing: 1.5px;
    color: #555;
}

.private {
    display: flex;
    align-items: center;
    gap: 5px;
}

.dot {
    width: 7px;
    height: 7px;
    background: #54a9c8;
    border-radius: 50%;
}

/* LOGO */

.logo-area {
    position: relative;
    margin: 24px auto 13px;
    width: 90px;
    height: 90px;
}

.logo {
    width: 90px;
    height: 90px;
    border-radius: 19px;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,.8);
    box-shadow: 0 5px 18px #0002;
}

.verified {
    position: absolute;
    bottom: -5px;
    right: -5px;
    width: 22px;
    height: 22px;
    background: #269bd4;
    border: 3px solid white;
    border-radius: 50%;
    color: white;
    font-size: 11px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 900;
}

/* CHANNEL NAME */

.channel-name {
    font-size: 21px;
    font-weight: 800;
    letter-spacing: -1px;
    color: #080808;
    margin-top: 15px;
    white-space: nowrap;
}

.channel-subtitle {
    font-size: 10px;
    color: #666;
    margin-top: 5px;
}

/* DETAILS */

.details {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    margin-top: 24px;
    padding: 13px 0 14px;
    border-bottom: 1px solid rgba(0,0,0,.12);
    border-top: 1px solid rgba(0,0,0,.12);
}

.detail-label {
    font-size: 7px;
    letter-spacing: 1px;
    color: #666;
    font-weight: 700;
    margin-bottom: 5px;
}

.detail-value {
    font-size: 11px;
    font-weight: 800;
    color: #111;
}

/* BOTTOM TICKET */

.ticket-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-top: 13px;
}

.barcode {
    width: 112px;
    height: 30px;

    background:
    repeating-linear-gradient(
        90deg,
        #111 0px,
        #111 2px,
        transparent 2px,
        transparent 4px,
        #111 4px,
        #111 5px,
        transparent 5px,
        transparent 8px
    );
}

.invite-number {
    text-align: right;
}

.invite-number small {
    display: block;
    font-size: 7px;
    letter-spacing: 1px;
    color: #777;
    margin-bottom: 3px;
}

.invite-number strong {
    font-size: 12px;
    letter-spacing: 2px;
}

/* BUTTON */

.button-area {
    margin-top: 15px;
}

.join-button {
    width: 100%;
    height: 54px;
    border: none;
    border-radius: 40px;

    background: linear-gradient(
        100deg,
        #85e9e1,
        #e3d0fa,
        #ffc5a9,
        #f7c3db,
        #a8e9e4
    );

    background-size: 300% 300%;
    animation: buttonGlow 5s ease infinite;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;

    color: #111;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;

    text-decoration: none;
    box-shadow: 0 5px 25px rgba(255,255,255,.12);
    transition: .3s;
}

@keyframes buttonGlow {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

.join-button:hover {
    transform: scale(1.025);
}

.arrow {
    width: 24px;
    height: 24px;
    background: #111;
    color: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
}

/* FOOTER */

.footer {
    margin-top: 13px;
    font-size: 8px;
    letter-spacing: 2px;
    color: #aaa;
}

.footer span {
    color: #fff;
    margin-right: 8px;
}

/* MOBILE */

@media(max-width:360px) {
    .container {
        max-width: 340px;
    }

    .channel-name {
        font-size: 19px;
    }

    .ticket {
        padding: 20px 16px;
    }
}
</style>
</head>

<body>

<div class="background" id="stars"></div>

<div class="container">

    <div class="top-title">
        ✦ &nbsp; YOU'RE INVITED &nbsp; ✦
    </div>

    <div class="ticket">

        <div class="ticket-header">
            <div class="private">
                <span class="dot"></span>
                PRIVATE PASS
            </div>

            <div>ADMIT ONE</div>
        </div>

        <div class="logo-area">

            <!-- Upload your logo as logo.png -->

            <img src="logo.png" class="logo" alt="VIP BROTHER'S Logo">

            <div class="verified">✓</div>

        </div>

        <h1 class="channel-name">
            VIP BROTHER'S
        </h1>

        <p class="channel-subtitle">
            Official Telegram channel
        </p>

        <div class="details">

            <div>
                <div class="detail-label">ACCESS</div>
                <div class="detail-value">FREE</div>
            </div>

            <div>
                <div class="detail-label">ENTRY</div>
                <div class="detail-value">INSTANT</div>
            </div>

            <div>
                <div class="detail-label">DATE</div>
                <div class="detail-value">2 NOV</div>
            </div>

        </div>

        <div class="ticket-bottom">

            <div class="barcode"></div>

            <div class="invite-number">
                <small>INVITE NO</small>
                <strong>4623</strong>
            </div>

        </div>

    </div>

    <div class="button-area">

        <a href="https://t.me/+AB7Cz-OtoKo0MDg1"
           class="join-button"
           target="_blank"
           rel="noopener noreferrer">

            Accept invite

            <span class="arrow">➜</span>

        </a>

    </div>

    <div class="footer">
        <span>FREE</span> OPENS IN TELEGRAM
    </div>

</div>

<script>

/* STAR ANIMATION */

const stars = document.getElementById("stars");

for (let i = 0; i < 65; i++) {

    const star = document.createElement("div");

    star.className = "star";

    const size = Math.random() * 2 + 1;

    star.style.width = size + "px";
    star.style.height = size + "px";

    star.style.left = Math.random() * 100 + "%";
    star.style.top = Math.random() * 100 + "%";

    star.style.animationDelay = Math.random() * 3 + "s";

    stars.appendChild(star);

}

</script>

</body>
</html>
