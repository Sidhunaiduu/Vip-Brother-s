<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VIP BROTHER'S | Private Invitation</title>

<meta name="theme-color" content="#080808">
<meta name="description" content="VIP BROTHER'S - Private Telegram Invitation">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 35%, #242424 0%, #101010 40%, #050505 100%);
    color: #fff;
    font-family: 'Inter', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image: radial-gradient(#ffffff12 1px, transparent 1px);
    background-size: 26px 26px;
    pointer-events: none;
    opacity: .35;
}

.card {
    position: relative;
    width: 100%;
    max-width: 390px;
    padding: 38px 25px 30px;
    text-align: center;
    border: 1px solid #ffffff20;
    border-radius: 25px;
    background: linear-gradient(145deg, #1b1b1b, #0b0b0b 65%);
    box-shadow: 0 25px 80px #000000b0;
    animation: appear .8s ease;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.badge {
    display: inline-block;
    padding: 8px 15px;
    border: 1px solid #d4b46b66;
    border-radius: 30px;
    color: #e5c982;
    font-size: 10px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 28px;
}

.logo {
    width: 94px;
    height: 94px;
    margin: 0 auto 23px;
    border: 1px solid #d4b46b;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(145deg, #29251c, #090909);
    box-shadow: 0 0 35px #d4b46b20;
}

.logo span {
    font-size: 34px;
    font-weight: 900;
    color: #e8cd8d;
    letter-spacing: -3px;
}

h1 {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: 1px;
    margin-bottom: 12px;
}

.subtitle {
    font-size: 12px;
    color: #999;
    line-height: 1.8;
    letter-spacing: .5px;
}

.divider {
    width: 55px;
    height: 2px;
    background: #d4b46b;
    margin: 25px auto;
}

.invite-title {
    color: #e3c47e;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: 2px;
    margin-bottom: 10px;
}

.description {
    color: #aaa;
    font-size: 12px;
    line-height: 1.8;
    margin-bottom: 26px;
}

.join-btn {
    display: flex;
    width: 100%;
    height: 57px;
    align-items: center;
    justify-content: center;
    gap: 11px;
    background: linear-gradient(100deg, #e7cc8b, #b99550);
    border-radius: 12px;
    color: #100e09;
    text-decoration: none;
    font-size: 13px;
    font-weight: 900;
    letter-spacing: 1.2px;
    box-shadow: 0 8px 30px #d4b46b25;
    transition: .25s;
}

.join-btn:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 35px #d4b46b40;
}

.join-btn svg {
    width: 20px;
    height: 20px;
}

.footer {
    margin-top: 25px;
    font-size: 9px;
    color: #666;
    letter-spacing: 2px;
}

.footer span {
    color: #d4b46b;
}
</style>
</head>

<body>

<div class="card">

    <div class="badge">✦ PRIVATE INVITATION ✦</div>

    <div class="logo">
        <span>VB</span>
    </div>

    <h1>VIP BROTHER'S</h1>

    <p class="subtitle">
        YOU HAVE BEEN INVITED TO JOIN<br>
        OUR PRIVATE COMMUNITY
    </p>

    <div class="divider"></div>

    <div class="invite-title">EXCLUSIVE ACCESS</div>

    <p class="description">
        A private space for our exclusive members.<br>
        Join our official Telegram community today.
    </p>

    <a class="join-btn"
       href="https://t.me/+AB7Cz-OtoKo0MDg1"
       target="_blank"
       rel="noopener noreferrer">

       <svg viewBox="0 0 24 24" fill="none">
         <path d="M21 3L3.8 9.8C2.6 10.3 2.6 11.9 3.9 12.3L8.3 13.7L10 19.1C10.4 20.3 11.9 20.5 12.6 19.5L15.1 16.2L19.5 19.4C20.5 20.1 21.9 19.5 22 18.3L23 4.5C23.1 3.3 22 2.6 21 3Z" fill="currentColor"/>
       </svg>

       ACCEPT INVITATION
    </a>

    <div class="footer">
       <span>●</span> OFFICIAL COMMUNITY
    </div>

</div>

</body>
  </html>
